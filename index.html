<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δίκτυο σπιτιού</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14232b;--mute:#5b6b72;--line:#d5dedb;--accent:#0f6b63;--block:#a8261b;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1e;--card:#17262c;--ink:#e6efed;--mute:#93a7ad;--line:#2a3d44;--accent:#4fc1b4;--block:#ff8a7a;--ok:#6fd49a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:8px 0 2px}
h2{font-size:1.05rem;margin:28px 0 10px}
p.sub{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:140px}
.name{font-weight:650;font-size:1.05rem}
.tag{font-size:.85rem;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.tag.b{color:var(--block)}.tag.p{color:var(--ok)}
.doms{color:var(--mute);font-size:.85rem;margin:2px 0 10px;word-break:break-all}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
button{cursor:pointer;font-weight:600}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.main{color:#06231f}}
button.del{color:var(--block)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.exc{font-size:.9rem;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.exc button{padding:2px 8px;font-size:.85rem}
#msg{position:fixed;left:12px;right:12px;bottom:12px;max-width:696px;margin:auto;background:var(--block);color:#fff;border-radius:8px;padding:10px 14px;display:none}
.chips button{padding:5px 11px;font-weight:500}
</style>
</head>
<body>
<main>
<h1>Δίκτυο σπιτιού</h1>
<p class="sub">Μπλοκάρισμα και ξεμπλοκάρισμα σελίδων για όλο το σπίτι.</p>

<h2>Μπλόκαρε κάτι</h2>
<div class="card">
  <div class="chips row" id="presets"></div>
  <form class="row" id="addForm" style="margin-top:12px">
    <input class="grow" id="domain" placeholder="ή γράψε ένα site, π.χ. example.com" autocomplete="off">
    <button class="main">Μπλόκαρε</button>
  </form>
</div>

<h2>Μπλοκαρισμένα</h2>
<div id="list"></div>
<datalist id="clients"></datalist>
</main>
<div id="msg" role="alert"></div>

<script>
const $ = s => document.querySelector(s);
let S = null, PRE = {}, NOW = 0;

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  kids.flat().forEach(c => e.append(c));
  return e;
}
function flash(t){const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',5000)}
async function api(path, body){
  const r = await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({ok:false,error:'Σφάλμα επικοινωνίας'}));
  if(!j.ok) flash(j.error||'Κάτι πήγε στραβά'); await load();
}
function left(ts){const m=Math.max(1,Math.round((ts-NOW)/60));return m>=60?`${Math.floor(m/60)} ώρ. ${m%60} λ.`:`${m} λ.`}

function groups(){
  const out=[], used=new Set(), have=new Map(S.blocked.map(b=>[b.domain,b]));
  for(const [name,doms] of Object.entries(PRE)){
    const items=doms.filter(d=>have.has(d)).map(d=>have.get(d));
    if(items.length){out.push({name,items});items.forEach(i=>used.add(i.domain))}
  }
  S.blocked.filter(b=>!used.has(b.domain)).forEach(b=>out.push({name:b.domain,items:[b]}));
  return out;
}

function render(){
  $('#presets').replaceChildren(...Object.keys(PRE).map(n=>h('button',{onclick:()=>api('block',{preset:n})},n)));
  $('#clients').replaceChildren(...S.clients.map(c=>h('option',{value:c})));
  const list=$('#list');
  if(!S.blocked.length){list.replaceChildren(h('p',{class:'sub'},'Τίποτα μπλοκαρισμένο ακόμα. Διάλεξε μια υπηρεσία από πάνω.'));return}
  list.replaceChildren(...groups().map(g=>{
    const doms=g.items.map(i=>i.domain);
    const paused=g.items.every(i=>i.paused_until&&i.paused_until>NOW);
    const until=paused?Math.max(...g.items.map(i=>i.paused_until)):0;
    const excs=S.exceptions.filter(e=>doms.includes(e.domain));
    const seen=new Set(); // μία γραμμή ανά συσκευή
    const dur=h('select',{},h('option',{value:15},'15 λεπτά'),h('option',{value:60,selected:''},'1 ώρα'),h('option',{value:180},'3 ώρες'),h('option',{value:0},'μέχρι να το ξαναμπλοκάρω'));
    const dev=h('input',{list:'clients',placeholder:'όνομα ή IP συσκευής',class:'grow'});
    return h('div',{class:'card'},
      h('div',{class:'row'},
        h('span',{class:'name grow'},g.name),
        paused?h('span',{class:'tag p'},'ανοιχτό ακόμα '+left(until)):h('span',{class:'tag b'},'μπλοκαρισμένο')),
      h('div',{class:'doms'},doms.join(', ')),
      h('div',{class:'row'},
        paused
          ?h('button',{class:'main',onclick:()=>api('pause',{domains:doms,minutes:0})},'Μπλόκαρε τώρα')
          :[h('span',{},'Ξεμπλόκαρε για όλους:'),dur.cloneNode(true),
             h('button',{onclick:e=>api('pause',{domains:doms,minutes:+e.target.previousSibling.value})},'Ξεμπλόκαρε')],
        h('button',{class:'del',onclick:()=>confirm(`Να σταματήσει το μπλοκάρισμα του «${g.name}» οριστικά;`)&&Promise.all(doms.map(d=>fetch('/api/unblock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:d})}))).then(load)},'Αφαίρεση')),
      h('div',{class:'exc'},
        h('div',{class:'row'},dev,dur,h('button',{onclick:()=>api('allow',{domains:doms,client:dev.value,minutes:+dur.value})},'Επίτρεψε μόνο σε αυτή τη συσκευή')),
        excs.filter(e=>!seen.has(e.client+e.until)&&seen.add(e.client+e.until)).map(e=>
          h('div',{class:'row',style:'margin-top:6px'},
            h('span',{},`✓ ${e.client}${e.until?' (άλλα '+left(e.until)+')':' (μόνιμα)'}`),
            h('button',{onclick:()=>Promise.all(excs.filter(x=>x.client===e.client&&x.until===e.until).map(x=>fetch('/api/disallow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id})}))).then(load)},'Ακύρωση')))));
  }));
}

async function load(){
  const j=await (await fetch('/api/state')).json();
  S=j.state;PRE=j.presets;NOW=j.now;render();
}
$('#addForm').addEventListener('submit',async e=>{e.preventDefault();const d=$('#domain').value;if(d){await api('block',{domain:d});$('#domain').value=''}});
load();setInterval(load,30000);
</script>
</body>
</html>
